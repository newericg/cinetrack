<aside class="sidebar">
  <!-- Logo -->
  <div class="sidebar__logo">
    <div class="sidebar__brand">
      <div class="sidebar__icon">
        <svg fill="currentColor" viewBox="0 0 24 24" width="14" height="14">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </div>
      <span class="sidebar__name">CineTrack</span>
    </div>
    <button class="sidebar__lang-btn" type="button" (click)="i18n.toggleLocale()">
      {{ i18n.t().lang_toggle }}
    </button>
    <button class="sidebar__theme-btn" type="button" (click)="toggleTheme.emit()">
      @if (isDarkMode()) {
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
        </svg>
      } @else {
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
      }
    </button>
  </div>

  <!-- Nav -->
  <nav class="sidebar__nav">
    <a class="sidebar__link" routerLink="/dashboard" routerLinkActive="sidebar__link--active">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      {{ i18n.t().nav_home }}
    </a>
    <a class="sidebar__link" routerLink="/movies" routerLinkActive="sidebar__link--active">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"/>
      </svg>
      {{ i18n.t().nav_movies }}
    </a>
    <a class="sidebar__link" routerLink="/series" routerLinkActive="sidebar__link--active">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
      {{ i18n.t().nav_series }}
    </a>
    <a class="sidebar__link" routerLink="/anime" routerLinkActive="sidebar__link--active">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      {{ i18n.t().nav_anime }}
    </a>
  </nav>

  <!-- User Profile -->
  <div class="sidebar__footer">
    <div class="sidebar__user">
      <div class="sidebar__avatar">
        {{ authService.currentUser()?.name?.charAt(0)?.toUpperCase() }}
      </div>
      <div class="sidebar__user-info">
        <p class="sidebar__user-name">{{ authService.currentUser()?.name }}</p>
        <p class="sidebar__user-role">Premium Member</p>
      </div>
      <button class="sidebar__settings" type="button" (click)="authService.logout()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
      </button>
    </div>
  </div>
</aside>
