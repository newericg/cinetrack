<header class="topbar">
  <div class="topbar__inner">

    <!-- Mobile Logo -->
    <div class="topbar__mobile-brand">
      <div class="topbar__mobile-icon">
        <svg fill="currentColor" viewBox="0 0 24 24" width="14" height="14">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </div>
      <span class="topbar__mobile-name">CINE<span>TRACK</span></span>
    </div>

    <!-- Search -->
    <div class="topbar__search">
      <svg class="topbar__search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input
        class="topbar__search-input"
        type="text"
        placeholder="Search library..."
        [(ngModel)]="searchQuery"
        (input)="onSearch()"
      />
    </div>

    <!-- Actions -->
    <div class="topbar__actions">
      <button class="topbar__action-btn topbar__theme-mobile" type="button" (click)="toggleTheme.emit()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
      </button>
      <button class="topbar__action-btn" type="button">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
      </button>
    </div>

  </div>
</header>
